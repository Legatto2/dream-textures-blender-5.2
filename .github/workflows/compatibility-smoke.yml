name: Compatibility smoke checks

on:
  pull_request:
    branches: [blender-5.2-compat]
  push:
    branches: [blender-5.2-compat]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Install the array dependency for capture tests
        run: python -m pip install --disable-pip-version-check numpy==2.3.4

      - name: Compile Python source
        run: python -m compileall -q .

      - name: Run focused tests without Blender or model inference
        run: python compatibility/run_offline_tests.py

      - name: Build and check the source package
        run: |
          python compatibility/build_zip.py --source . --output "$RUNNER_TEMP/Dream-Textures-0.4.2-compat3-Blender52-Windows.zip"
          git diff --exit-code -- compatibility/BUILD_MANIFEST.json

      - name: Preserve the checked package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dream-Textures-compat3-source-package
          path: ${{ runner.temp }}/Dream-Textures-0.4.2-compat3-Blender52-Windows.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
